
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vamsikrishnadesai
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Remove bottom loading bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for filename in (
              "dist/github-snake.svg",
              "dist/github-snake-dark.svg",
          ):
              path = Path(filename)
              svg = path.read_text()

              def clean_rect(match):
                  tag = match.group(0)
                  attrs = dict(
                      re.findall(r'([\w:-]+)="([^"]*)"', tag)
                  )

                  try:
                      width = float(attrs.get("width", "0"))
                      height = float(attrs.get("height", "0"))
                  except ValueError:
                      return tag

                  # Remove long horizontal rectangles only.
                  if width > 300 and height > 1:
                      print(f"Removing bar: {tag}")
                      return ""

                  return tag

              svg = re.sub(r"<rect\b[^>]*?/>", clean_rect, svg)
              path.write_text(svg)

              print(f"Cleaned {filename}")
          PY

      - name: Publish cleaned SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

