name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vamsikrishnadesai
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Remove bottom bar by cropping SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for filename in (
              "dist/github-snake.svg",
              "dist/github-snake-dark.svg",
          ):
              path = Path(filename)
              svg = path.read_text()

              # Find the SVG canvas dimensions.
              match = re.search(r'<svg\b[^>]*>', svg)
              if not match:
                  raise RuntimeError(f"SVG header not found: {filename}")

              header = match.group(0)

              # The generated snake uses a viewBox; crop its lower section.
              viewbox = re.search(
                  r'viewBox="([\d.\-]+)\s+([\d.\-]+)\s+([\d.]+)\s+([\d.]+)"',
                  header
              )

              if viewbox:
                  x, y, width, height = map(float, viewbox.groups())

                  # Crop the bottom 45 units from the visible canvas.
                  new_height = height - 45
                  if new_height <= 0:
                      raise RuntimeError("Invalid SVG crop height")

                  new_viewbox = (
                      f'viewBox="{x:g} {y:g} {width:g} {new_height:g}"'
                  )

                  header = header[:viewbox.start()] + new_viewbox + header[viewbox.end():]
                  svg = svg[:match.start()] + header + svg[match.end():]
                  path.write_text(svg)

                  print(f"Cropped {filename}: height {height:g} -> {new_height:g}")
              else:
                  print(f"No viewBox found in {filename}; left unchanged")
          PY

      - name: Publish snake SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
