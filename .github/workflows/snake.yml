name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vamsikrishnadesai
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

    
      - name: Inspect SVG dimensions and bottom elements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for filename in [
              "dist/github-snake.svg",
              "dist/github-snake-dark.svg"
          ]:
              path = Path(filename)
              svg = path.read_text()

              print(f"\n--- {filename} ---")

              match = re.search(r'<svg\b[^>]*>', svg)
              print("SVG header:", match.group(0) if match else "Not found")

              for element in re.findall(
                  r'<(?:rect|path|line|polyline)\b[^>]*>',
                  svg
              ):
                  attrs = dict(re.findall(r'([\w:-]+)="([^"]*)"', element))
                  try:
                      y = float(attrs.get("y", "-1"))
                  except ValueError:
                      y = -1

                  if y >= 0:
                      print(element)
          PY


      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
